<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Usuarios | TechAssist</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <link
    rel="stylesheet"
    href="./css/dashboard.css"
  >
</head>

<body>

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">
      <h2>TechAssist</h2>
    </div>

    <nav class="sidebar-menu">

      <a
        href="./dashboard.html"
        class="menu-item"
      >
        <i class="bi bi-house-door"></i>
        <span>Inicio</span>
      </a>

      <a
        href="./registro-servicio.html"
        class="menu-item"
      >
        <i class="bi bi-clipboard-plus"></i>
        <span>Nuevo servicio</span>
      </a>

      <a
        href="./horas-extras.html"
        class="menu-item"
      >
        <i class="bi bi-clock-history"></i>
        <span>Horas extras</span>
      </a>

      <a
        href="./liquidaciones.html"
        class="menu-item"
      >
        <i class="bi bi-receipt"></i>
        <span>Liquidaciones</span>
      </a>

      <a
        href="./usuarios.html"
        class="menu-item active"
      >
        <i class="bi bi-people"></i>
        <span>Administrar usuarios</span>
      </a>

    </nav>

    <div class="sidebar-footer">

      <button
        type="button"
        class="btn btn-outline-light w-100"
        id="btnCerrarSesion"
      >
        <i class="bi bi-box-arrow-left"></i>
        Cerrar sesión
      </button>

    </div>

  </aside>


  <main class="main-content">

    <header class="topbar">

      <button
        type="button"
        class="btn btn-light menu-button"
        id="btnMenu"
      >
        <i class="bi bi-list"></i>
      </button>

      <div>
        <span class="text-secondary">
          Administrador:
        </span>

        <strong id="nombreUsuario">
          Usuario
        </strong>
      </div>

    </header>


    <section class="content">

      <div class="welcome-section">

        <h1>
          Administración de usuarios
        </h1>

        <p>
          Crea, consulta, activa o desactiva usuarios de TechAssist.
        </p>

      </div>


      <div class="card mt-4">

        <div class="card-body">

          <div
            class="d-flex justify-content-between align-items-center mb-3"
          >

            <h4 class="mb-0">
              Usuarios
            </h4>

            <button
              type="button"
              class="btn btn-primary"
              id="btnNuevoUsuario"
            >
              <i class="bi bi-person-plus"></i>
              Nuevo usuario
            </button>

          </div>


          <div
            id="cargandoUsuarios"
            class="text-center py-4"
          >

            <div
              class="spinner-border text-primary"
            ></div>

            <p class="mt-3">
              Cargando usuarios...
            </p>

          </div>


          <div
            id="tablaUsuariosContenedor"
            class="table-responsive d-none"
          >

            <table
              class="table table-hover align-middle"
            >

              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Correo</th>
                  <th>Bodega</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="tablaUsuarios">
              </tbody>

            </table>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- Modal nuevo usuario -->



  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="./js/config.js"></script>
  <script src="./js/usuarios.js"></script>

</body>

</html>
