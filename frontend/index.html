<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TechAssist | Iniciar sesión</title>

  <link
    rel="icon"
    type="image/png"
    href="./img/logo-techassist.png"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <link
    rel="stylesheet"
    href="./css/login.css"
  >
</head>

<body>

  <main class="login-container">

    <section class="card login-card">

      <div class="card-body p-4 p-md-5">

        <!-- LOGO -->
        <div class="text-center login-brand">

          <img
            src="./img/logo-techassist.png"
            alt="Logo TechAssist"
            class="login-logo"
          >

          <h1>
            TechAssist
          </h1>

          <p class="brand-subtitle">
            Gestión Técnica
          </p>

          <p class="login-description">
            Ingresa tus credenciales para continuar
          </p>

        </div>


        <!-- FORMULARIO -->
        <form id="loginForm">

          <div class="mb-3">

            <label
              for="correo"
              class="form-label"
            >
              Correo electrónico
            </label>

            <div class="input-group">

              <span class="input-group-text">
                <i class="bi bi-envelope"></i>
              </span>

              <input
                type="email"
                class="form-control"
                id="correo"
                name="correo"
                placeholder="correo@ejemplo.com"
                autocomplete="email"
                required
              >

            </div>

          </div>


          <div class="mb-4">

            <label
              for="password"
              class="form-label"
            >
              Contraseña
            </label>

            <div class="input-group">

              <span class="input-group-text">
                <i class="bi bi-lock"></i>
              </span>

              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                minlength="6"
                required
              >

            </div>

          </div>


          <div
            id="mensaje"
            class="alert d-none"
            role="alert"
          ></div>


          <button
            type="submit"
            class="btn btn-primary w-100 btn-login"
            id="btnLogin"
          >
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Iniciar sesión
          </button>

        </form>


        <div class="login-footer">
          <small>
            Sistema de Gestión Técnica
          </small>
        </div>

      </div>

    </section>

  </main>


  <script src="./js/config.js"></script>
  <script src="./js/login.js"></script>

</body>

</html>
